<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showroom — TIJORAT MARKAZI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="skyline" id="skyline" aria-hidden="true"></div>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-text">
          <strong>TIJORAT MARKAZI</strong>
          <em>Milliy savdo platformasi</em>
        </span>
      </a>
      <nav class="nav" id="nav">
        <a href="index.html" data-i18n="nav_home">Bosh sahifa</a>
        <a href="showroom.html" data-i18n="nav_showroom">Showroom</a>
        <a href="associations.html" data-i18n="nav_uyush">Uyushmalar</a>
        <a href="about.html" data-i18n="nav_about">Biz haqimizda</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" type="button" title="Tema" aria-label="Tema"></button>
        <button class="lang-btn" id="langBtn" type="button" title="Til">UZ</button>
        <a class="btn btn-ghost" href="index.html" data-i18n="d_home">Bosh sahifa</a>
      </div>
      <button class="burger" id="burger" aria-label="Menyu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="section" id="showroom">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow" data-i18n="show_eyebrow">Showroom</span>
        <h2 data-i18n-html="show_h2">Kompaniyalar <span class="grad">mahsulotlari</span></h2>
        <p data-i18n="show_p">TIJORAT MARKAZI a'zolari taqdim etgan mahsulot va xizmatlar.</p>
      </div>
      <div class="show-filter">
        <input type="search" id="showSearch" data-i18n-ph="show_search" placeholder="Mahsulot yoki kompaniya qidirish…" autocomplete="off" />
        <div class="sel-wrap"><select id="showSector"><option value="" data-i18n="show_all_sectors">Barcha sohalar</option></select></div>
        <div class="sel-wrap"><select id="showAssoc"><option value="" data-i18n="show_all_assocs">Barcha uyushmalar</option></select></div>
        <div class="sel-wrap"><select id="showCompany"><option value="" data-i18n="show_all_companies">Barcha kompaniyalar</option></select></div>
        <span class="show-count" id="showCount"></span>
      </div>
      <div class="show-grid" id="homeShowGrid"></div>
      <p class="show-empty-home" id="showEmpty" hidden data-i18n="show_empty">Hozircha mahsulotlar yo'q.</p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container footer-bottom">
      <span data-i18n="foot_copy">© 2026 TIJORAT MARKAZI.</span>
      <span data-i18n="foot_country">O'zbekiston · Milliy savdo platformasi</span>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="showroom.js"></script>
  <script src="monument-bg.js"></script>
  <script src="skyline.js"></script>
  <script src="background.js"></script>
  <script src="logout.js"></script>
</body>
</html>
